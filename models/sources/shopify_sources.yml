version: 2

sources:
  - name: shopify
    database: postgres
    schema: public
    tables:
      # Core transaction tables
      - name: shopify_orders
      - name: shopify_order_refunds
      - name: shopify_order_agreements
      - name: shopify_order_risks
      - name: shopify_transactions

      # Product tables
      - name: shopify_products
      - name: shopify_product_variants
      - name: shopify_product_images
      - name: shopify_deleted_products

      # Collection tables
      - name: shopify_collections
      - name: shopify_collection_products
      - name: shopify_collects
      - name: shopify_custom_collections
      - name: shopify_smart_collections

      # Customer tables
      - name: shopify_customers
      - name: shopify_customer_address
      - name: shopify_customer_journey_summary

      # Inventory tables
      - name: shopify_inventory_items
      - name: shopify_inventory_levels

      # Fulfilment tables
      - name: shopify_fulfillments
      - name: shopify_fulfillment_orders

      # Marketing and discounts
      - name: shopify_discount_codes
      - name: shopify_price_rules
      - name: shopify_abandoned_checkouts

      # Metafield tables
      - name: shopify_metafield_orders
      - name: shopify_metafield_products
      - name: shopify_metafield_product_variants
      - name: shopify_metafield_customers
      - name: shopify_metafield_collections
      - name: shopify_metafield_smart_collections
      - name: shopify_metafield_locations
      - name: shopify_metafield_draft_orders
      - name: shopify_metafield_articles
      - name: shopify_metafield_blogs
      - name: shopify_metafield_pages
      - name: shopify_metafield_product_images
      - name: shopify_metafield_shops

      # Finance and operations
      - name: shopify_balance_transactions
      - name: shopify_tender_transactions
      - name: shopify_draft_orders

      # Reference tables
      - name: shopify_locations
      - name: shopify_shop
      - name: shopify_countries
      - name: shopify_disputes

      # Content tables
      - name: shopify_articles
      - name: shopify_blogs
      - name: shopify_pages