version: 2

models:
  - name: mart_net_revenue_daily
    description: "Daily net revenue. Primary table for Agent A threshold checks."
    columns:
      - name: order_date
        tests:
          - unique
          - not_null
      - name: order_count
        tests:
          - not_null
      - name: gross_revenue
        tests:
          - not_null
      - name: net_revenue
        tests:
          - not_null
      - name: data_completeness_pct
        tests:
          - not_null
