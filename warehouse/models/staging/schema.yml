version: 2

models:
  - name: stg_shopify_orders
    description: "Cleaned Shopify orders. Excludes cancelled and voided."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: order_date
        tests: [not_null]
      - name: gross_revenue
        tests: [not_null]
      - name: financial_status
        tests: [not_null]

  - name: stg_shopify_refunds
    description: "Cleaned Shopify refunds. One row per refund."
    columns:
      - name: refund_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: refund_date
        tests: [not_null]

  - name: stg_shopify_order_line_items
    description: "Shopify order line items with revenue per line."
    columns:
      - name: line_item_id
        tests: [unique, not_null]
      - name: order_id
        tests: [not_null]
      - name: sku
        tests: [not_null]

  - name: stg_shopify_order_source_attribution
    description: "Classifies every order by originating system."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: order_source_system
        tests: [not_null]
      - name: attribution_confidence
        tests: [not_null]

  - name: stg_shopify_net_sales_validation
    description: "Replicates Shopify Net Sales formula for validation."
    columns:
      - name: order_date
        tests: [unique, not_null]
      - name: gross_sales
        tests: [not_null]

  - name: stg_meta_ad_performance
    description: "Meta ad performance. Casts text columns to numeric."
    columns:
      - name: date
        tests: [not_null]
      - name: spend
        tests: [not_null]

  - name: stg_tiktok_ad_performance
    description: "TikTok paid ad performance. One row per campaign per day."
    columns:
      - name: date
        tests: [not_null]
      - name: spend
        tests: [not_null]

  - name: stg_klaviyo_email_events
    description: "Klaviyo email events with revenue attribution."
    columns:
      - name: message_id
        tests: [unique, not_null]
      - name: event_date
        tests: [not_null]

  - name: stg_gorgias_tickets
    description: "Gorgias support tickets with resolution tier."
    columns:
      - name: ticket_id
        tests: [unique, not_null]
      - name: ticket_date
        tests: [not_null]

  - name: stg_ga4_sessions
    description: "GA4 sessions joined with funnel stage data."
    columns:
      - name: date
        tests: [not_null]
      - name: sessions
        tests: [not_null]

  - name: stg_ga4_checkout_errors
    description: "GA4 checkout errors by date, hour, and type."
    columns:
      - name: date
        tests: [not_null]
      - name: error_count
        tests: [not_null]

  - name: stg_loop_returns
    description: "Loop Returns with line item aggregation and lag segment."
    columns:
      - name: return_id
        tests: [unique, not_null]
      - name: return_date
        tests: [not_null]

  - name: stg_loop_return_line_items
    description: "Filtered Loop return line items (one row per line_item_id). RULE-3 per-client synthetic filter applied here; provenance is transitive via the parent loop_returns header."
    columns:
      - name: line_item_id
        tests: [unique, not_null]
      # not_null on return_id is the orphan tripwire: a broken transitive join
      # (line item with no header) surfaces loudly here rather than silently
      # leaking as real.
      - name: return_id
        tests: [not_null]
      - name: sku
        tests: [not_null]
      - name: return_reason_primary
        tests: [not_null]

  - name: stg_sentry_errors
    description: "Sentry errors by date, hour, type, and browser."
    columns:
      - name: date
        tests: [not_null]
      - name: error_count
        tests: [not_null]

  # ── Phase D (R11): the 5 previously-untested staging models ──────────────
  # Single-key models: column-level unique + not_null. Composite-key models:
  # not_null on each key column here; composite UNIQUENESS is enforced by native
  # singular tests in warehouse/tests/ (dbt_utils absent; RULE 4 — no surrogate
  # cast in the model SQL).
  - name: stg_klaviyo_flows
    description: "Klaviyo flows aggregated from email events (one row per flow_id)."
    columns:
      - name: flow_id
        tests: [unique, not_null]

  - name: stg_klaviyo_profiles
    description: "Klaviyo profiles sourced from shopify_customers (one row per profile_id)."
    columns:
      - name: profile_id
        tests: [unique, not_null]

  # ISLAND-ONLY: source shopify_inventory_items is Airbyte-managed (no is_synthetic)
  # and holds ~1 real Egnition row. Tests must pass on a single row and must NOT
  # assume any synthetic rows exist.
  - name: stg_shopify_inventory_items
    description: "Shopify inventory items (Tier-2 COGS). Island-only (~1 real row)."
    columns:
      - name: inventory_item_id
        tests: [unique, not_null]

  - name: stg_shopify_inventory_levels
    description: "Inventory levels per item/location. Composite key (see tests/assert_unique_*)."
    columns:
      - name: inventory_item_id
        tests: [not_null]
      - name: location_id
        tests: [not_null]

  - name: stg_synthetic_touchpoint_journey
    description: "Multi-touch journeys. Composite key (see tests/assert_unique_*)."
    columns:
      - name: order_id
        tests: [not_null]
      - name: touchpoint_sequence
        tests: [not_null]
